name: SwizlyPeasy.Gateway Nugets

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'     
        required: true
        default: 'warning'
      packageVersion:
        description: 'NuGet package version in SemVer format (for example, 0.1.6-beta.1)'
        required: true
        type: string
  release:
    types: [published]

jobs:
  Build_Nuget_Packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.packageVersion }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore SwizlyPeasy.Gateway.sln
    - name: Build
      run: dotnet build --no-restore SwizlyPeasy.Gateway.sln -c Release
    - name: Pack SwizlyPeasy.Consul
      run: dotnet pack -c Release SwizlyPeasy.Consul/SwizlyPeasy.Consul.csproj --no-build --output . -p:PackageVersion="$PACKAGE_VERSION"
    - name: Pack SwizlyPeasy.Common
      run: dotnet pack -c Release SwizlyPeasy.Common/SwizlyPeasy.Common.csproj --no-build --output . -p:PackageVersion="$PACKAGE_VERSION"
    - name: Pack SwizlyPeasy.Gateway
      run: dotnet pack -c Release SwizlyPeasy.Gateway/SwizlyPeasy.Gateway.csproj --no-build --output . -p:PackageVersion="$PACKAGE_VERSION"
    - name: NuGet login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
      id: login
      with:
        user: ggnaegi
    - name: Push to NuGet
      run: dotnet nuget push "*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      
